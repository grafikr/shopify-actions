name: Lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  run-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install modules
        run: pnpm i

      - name: Run JavaScript
        if: always()
        run: pnpm lint-js

      - name: Run TypeScript
        if: always()
        run: pnpm lint-tsc
